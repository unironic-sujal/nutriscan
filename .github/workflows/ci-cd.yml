name: NutriScan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Backend Continuous Integration
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high || true
        # Using || true ensures the build doesn't hard-fail if there are non-critical vulnerabilities, 
        # but the results will be visible in the CI logs for review.

      - name: Run linting
        run: npx eslint . --ext .js || true

  # Frontend Continuous Integration
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high || true

      - name: Verify production build
        run: npm run build
